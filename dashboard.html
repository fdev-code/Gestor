<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Gestor Manao</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Barra Superior */
    .top-bar {
      width: 100%;
      height: 60px;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
    }

    .top-bar h1 {
      color: #a855f7;
      font-size: 1.2rem;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ec4899;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: #ec4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
    }

    /* Layout Principal */
    .dashboard-layout {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 25px;
      gap: 25px;
    }

    /* Menú Lateral */
    .sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 18px 15px;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .menu-btn i {
      font-size: 1.6rem;
      color: #a855f7;
      transition: all 0.3s ease;
    }

    .menu-btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: #a855f7;
      transform: translateX(4px);
    }

    .menu-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: #ec4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
    }

    .menu-btn.active i {
      color: #ec4899;
    }

    /* Contenido Principal */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    .tab-content {
      display: none;
      width: 100%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
    }

    .tab-content.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .form-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 25px 30px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(4px);
      margin: 0 auto;
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .form-header h2 {
      color: #ec4899;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-import {
      background: transparent;
      border: 1px solid #3b82f6;
      color: #60a5fa;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .btn-import:hover {
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
      border-color: #60a5fa;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      color: #a855f7;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input, textarea {
      background: #14141f;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 8px;
      padding: 9px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      border-color: #ec4899;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }

    textarea {
      resize: vertical;
      min-height: 75px;
    }

    .actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 1;
      background: transparent;
      border: 1px solid #a855f7;
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    /* Modal Emergente */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-card {
      background: #14141f;
      border: 1px solid #a855f7;
      border-radius: 16px;
      padding: 25px;
      width: 90%;
      max-width: 550px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h3 {
      color: #a855f7;
      font-size: 1.1rem;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #ec4899;
    }

    .modal-body textarea {
      width: 100%;
      height: 150px;
      margin-top: 10px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid #a1a1aa;
      color: #a1a1aa;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-process {
      background: #a855f7;
      border: none;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }

    .btn-process:hover {
      background: #9333ea;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <h1><i class="fa-solid fa-server"></i> Panel Gestor Manao</h1>
    <button class="btn-logout" onclick="window.location.href='index.html'">
      <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
    </button>
  </header>

  <div class="dashboard-layout">
    
    <!-- Menú Lateral -->
    <aside class="sidebar">
      <button class="menu-btn active" data-target="formulario">
        <i class="fa-solid fa-list-check"></i>
        Formulario
      </button>

      <button class="menu-btn" data-target="llamada">
        <i class="fa-solid fa-phone"></i>
        Llamada
      </button>

      <button class="menu-btn" data-target="datos">
        <i class="fa-solid fa-database"></i>
        Datos
      </button>

      <button class="menu-btn" data-target="mensaje">
        <i class="fa-solid fa-envelope"></i>
        Mensajes
      </button>

      <button class="menu-btn" data-target="suspension">
        <i class="fa-solid fa-ban"></i>
        Suspensión
      </button>
    </aside>

    <!-- Áreas de Contenido -->
    <main class="main-content">
      
      <!-- Sección Formulario -->
      <div id="formulario" class="tab-content active">
        <div class="form-card">
          <div class="form-header">
            <h2><i class="fa-solid fa-file-invoice"></i> Formato de Reporte de Incidencias</h2>
            <button class="btn-import" onclick="abrirModal()">
              <i class="fa-solid fa-file-import"></i> Pegar texto de Outlook
            </button>
          </div>

          <form id="incidenciaForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="linea">Línea</label>
                <input type="text" id="linea" placeholder="Número de línea">
              </div>

              <div class="form-group">
                <label for="simcard">Simcard</label>
                <input type="text" id="simcard" placeholder="Serial de Simcard">
              </div>

              <div class="form-group">
                <label for="tipoCliente">Tipo de Cliente</label>
                <input type="text" id="tipoCliente" placeholder="Ej: Pospago / Prepago">
              </div>

              <div class="form-group">
                <label for="tecnologia">Tecnología</label>
                <input type="text" id="tecnologia" placeholder="Ej: 3G / 4G / LTE">
              </div>

              <div class="form-group">
                <label for="titular">Titular</label>
                <input type="text" id="titular" placeholder="Nombre completo">
              </div>

              <div class="form-group">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" placeholder="V- / E- / J-">
              </div>

              <div class="form-group">
                <label for="motivoContacto">Motivo De Contacto</label>
                <input type="text" id="motivoContacto" placeholder="Motivo de la consulta">
              </div>

              <div class="form-group">
                <label for="estado">Estado</label>
                <input type="text" id="estado" placeholder="Estado / Región">
              </div>

              <div class="form-group">
                <label for="telefonoContacto">Teléfono De Contacto</label>
                <input type="text" id="telefonoContacto" placeholder="Número alternativo">
              </div>

              <div class="form-group">
                <label for="dealer">DEALER:</label>
                <input type="text" id="dealer" placeholder="Nombre o código del Dealer">
              </div>

              <div class="form-group full-width">
                <label for="detalleContacto">Detalle Del Contacto</label>
                <textarea id="detalleContacto" placeholder="Escriba la observación o detalle aquí..."></textarea>
              </div>
            </div>

            <div class="actions">
              <button type="button" class="btn-submit" onclick="copiarReporte()">
                <i class="fa-solid fa-copy"></i> Copiar Reporte
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Sección Llamada -->
      <div id="llamada" class="tab-content">
        <iframe src="llamada.html" style="width: 100%; height: 750px; border: none; background: transparent;"></iframe>
      </div>

      <!-- Sección Datos -->
      <div id="datos" class="tab-content">
        <iframe src="datos.html" style="width: 100%; height: 750px; border: none; background: transparent;"></iframe>
      </div>

      <!-- Sección Mensajes -->
      <div id="mensaje" class="tab-content">
        <iframe src="mensaje.html" style="width: 100%; height: 500px; border: none; background: transparent;" scrolling="no"></iframe>
      </div>

      <!-- Sección Suspensión -->
      <div id="suspension" class="tab-content">
        <iframe src="suspension.html" style="width: 100%; height: 500px; border: none; background: transparent;" scrolling="no"></iframe>
      </div>    

    </main>
  </div>

  <!-- Modal Outlook -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-envelope-open-text"></i> Pegar contenido del correo</h3>
        <button class="modal-close" onclick="cerrarModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 5px;">
          Copia el texto del correo de Outlook y pégalo abajo:
        </p>
        <textarea id="correoRawText" placeholder="Pega aquí el contenido del correo..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-process" onclick="procesarCorreo()">Extraer y Llenar</button>
      </div>
    </div>
  </div>

  <script>
    // Cambio de pestañas con transición suave y reseteo automático de iframes
    const menuButtons = document.querySelectorAll('.sidebar .menu-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    menuButtons.forEach(button => {
      button.addEventListener('click', () => {
        const target = button.getAttribute('data-target');

        // 1. Remover clase active de todos los botones y contenidos
        menuButtons.forEach(btn => btn.classList.remove('active'));
        tabContents.forEach(tab => tab.classList.remove('active'));

        // 2. Agregar clase active al botón presionado
        button.classList.add('active');

        // 3. Mostrar la pestaña correspondiente
        const targetTab = document.getElementById(target);
        if (targetTab) {
          targetTab.classList.add('active');

          // 4. Recargar el iframe si existe para asegurar que inicie limpio
          const iframe = targetTab.querySelector('iframe');
          if (iframe) {
            const currentSrc = iframe.getAttribute('src');
            if (currentSrc) {
              iframe.src = currentSrc;
            }
          }
        }
      });
    });

    // Funciones del Modal de Outlook
    function abrirModal() {
      document.getElementById('importModal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('importModal').style.display = 'none';
      document.getElementById('correoRawText').value = '';
    }

    // Procesar texto del correo (Ejemplo básico de extracción)
    function procesarCorreo() {
      const texto = document.getElementById('correoRawText').value;
      // Lógica de parseo aquí
      cerrarModal();
    }

    // Copiar Reporte Formateado al Portapapeles
    function copiarReporte() {
      const linea = document.getElementById('linea').value;
      const simcard = document.getElementById('simcard').value;
      const tipoCliente = document.getElementById('tipoCliente').value;
      const tecnologia = document.getElementById('tecnologia').value;
      const titular = document.getElementById('titular').value;
      const cedula = document.getElementById('cedula').value;
      const motivoContacto = document.getElementById('motivoContacto').value;
      const estado = document.getElementById('estado').value;
      const telefonoContacto = document.getElementById('telefonoContacto').value;
      const dealer = document.getElementById('dealer').value;
      const detalleContacto = document.getElementById('detalleContacto').value;

      const reporteFormateado = `--- REPORTE DE INCIDENCIA ---
Línea: ${linea}
Simcard: ${simcard}
Tipo de Cliente: ${tipoCliente}
Tecnología: ${tecnologia}
Titular: ${titular}
Cédula: ${cedula}
Motivo De Contacto: ${motivoContacto}
Estado: ${estado}
Teléfono De Contacto: ${telefonoContacto}
DEALER: ${dealer}
Detalle Del Contacto: ${detalleContacto}`;

      navigator.clipboard.writeText(reporteFormateado).then(() => {
        alert('¡Reporte copiado al portapapeles con éxito!');
      }).catch(err => {
        console.error('Error al copiar: ', err);
      });
    }
  </script>
</body>
</html>
