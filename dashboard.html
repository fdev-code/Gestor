<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido | Gestor</title>
  <!-- Iconos de FontAwesome para el icono de salida -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }

    /* Botón de Cerrar Sesión (Arriba a la derecha) */
    .btn-logout {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: 1px solid #ec4899;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-logout:hover {
      background: #ec4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
      transform: translateY(-2px);
    }

    .content {
      text-align: center;
    }

    h1 {
      color: #a855f7;
      margin-bottom: 10px;
    }

    p {
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <!-- Botón de Cerrar Sesión -->
  <button class="btn-logout" id="logoutBtn">
    <i class="fa-solid fa-right-from-bracket"></i>
    Cerrar sesión
  </button>

  <!-- Contenido Principal -->
  <div class="content">
    <h1>¡Inicio de sesión exitoso Manao!</h1>
    <p>El Manao te da la Bienvenida al panel principal de Gestor.</p>
  </div>

  <script>
    // Evento para redirigir al Inicio al presionar Cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
