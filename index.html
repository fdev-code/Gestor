<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="code-with-nazia.css">
</head>
<body>

  <div class="glow-container">
    <div class="card-content">
      <h2 class="heading">Manao</h2>
      <p class="subheading">Por favor, inicia sesión para continuar</p>

      <form action="#" class="login-form">
        <!-- Campo de Usuario -->
        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" placeholder="Usuario" required>
        </div>

        <!-- Campo de Contraseña con Ojo Toggle -->
        <div class="input-group password-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="passwordInput" placeholder="Contraseña" required>
          <i class="fa-solid fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
        </div>

        <!-- Opción Remember me -->
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Recordar</label>
        </div>

        <!-- Botón de Login -->
        <button type="submit" class="btn-login">Inicio &rarr;</button>

        <p class="social-text">O continuar con</p>

        <!-- Iconos de Redes Sociales -->
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-google"></i></a>
          <a href="#"><i class="fa-brands fa-apple"></i></a>
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
        </div>

        <!-- Enlace de registro -->
        <p class="account-text">¿No tienes cuenta?</p>
      </form>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    const form = document.querySelector('.login-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = form.querySelector('input[type="text"]').value;
      alert(`¡Bienvenido de nuevo, ${username}!`);
    });
  </script>
</body>
</html>
