<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="code-with-nazia.css">
</head>
<body>

  <div class="glow-container">
    <div class="card-content">
      <h2 class="heading">Login</h2>
      <p class="subheading">Please sign in to continue</p>

      <form action="#" class="login-form">
        <!-- Campo de Usuario -->
        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" placeholder="Username" required>
        </div>

        <!-- Campo de Contraseña con Ojo Toggle -->
        <div class="input-group password-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="passwordInput" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
        </div>

        <!-- Opciones del formulario -->
        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox"> Recordarme
          </label>
          <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón de envío -->
        <button type="submit" class="submit-btn">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <!-- JavaScript para la visibilidad de contraseña -->
  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }
  </script>

</body>
</html>
