<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada | Manao</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    /* Botón para regresar al Dashboard arriba a la izquierda */
    .btn-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background: transparent;
      border: 1px solid #a855f7;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-back:hover {
      background: #a855f7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      transform: translateY(-2px);
    }

    .content {
      text-align: center;
    }

    .icon-box {
      font-size: 3rem;
      color: #a855f7;
      margin-bottom: 15px;
    }

    h1 {
      color: #a855f7;
      margin-bottom: 10px;
    }

    p {
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <!-- Botón Volver -->
  <a href="dashboard.html" class="btn-back">
    <i class="fa-solid fa-arrow-left"></i>
    Volver al menú
  </a>

  <div class="content">
    <div class="icon-box">
      <i class="fa-solid fa-phone"></i>
    </div>
    <h1>Módulo de Llamada</h1>
    <p>Sección para la gestión y registro de llamadas.</p>
  </div>

</body>
</html>
