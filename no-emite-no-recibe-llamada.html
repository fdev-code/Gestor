<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Emite / No Recibe Llamada | Gestor Manao</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0px;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 950px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(4px);
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .form-header h2 {
      color: #ec4899;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-volver {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-volver i {
      color: #a855f7;
      transition: all 0.3s ease;
    }

    .btn-volver:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: #ec4899;
      transform: translateY(-1px);
    }

    .btn-volver:hover i {
      color: #ec4899;
    }

    .submenu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .sub-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      width: 100%;
      transition: all 0.3s ease;
      text-align: left;
    }

    .sub-btn.full-row {
      grid-column: span 2;
    }

    .sub-btn i {
      color: #a855f7;
      font-size: 1.15rem;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .sub-btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: #a855f7;
      transform: translateY(-2px);
    }

    .sub-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: #ec4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
    }

    .sub-btn.active i {
      color: #ec4899;
    }

    @media (max-width: 768px) {
      .submenu-grid {
        grid-template-columns: 1fr;
      }
      .sub-btn.full-row {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2><i class="fa-solid fa-phone-slash"></i> No emite / No recibe llamada</h2>
      <button type="button" class="btn-volver" onclick="location.href='llamada.html'">
        <i class="fa-solid fa-arrow-left"></i> Volver
      </button>
    </div>

    <!-- Submenú de Opciones -->
    <div class="submenu-grid">
      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-check-circle"></i> Categoría correcta
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-sim-card"></i> Ki del imsi no cargado en udm
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-file-invoice"></i> Activa en facturador suspendida en udm
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-phone-volume"></i> No suministran número de contacto
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-triangle-exclamation"></i> Balance cero en facturador suspendida en udm
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-id-badge"></i> No supera ID positivo
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-eraser"></i> Borrado de VLR voz
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-qrcode"></i> QR desconfigurado
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-link-slash"></i> Desconectado de udm
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-user-clock"></i> Usuario no disponible para efectuar pruebas
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-triangle-exclamation"></i> IMSI errado en el udm
      </button>

      <button type="button" class="sub-btn" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-mobile-screen"></i> Usuario no posee el equipo a la mano
      </button>

      <button type="button" class="sub-btn full-row" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-ban"></i> Inhibida
      </button>

      <button type="button" class="sub-btn full-row" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-clipboard-check"></i> Usuario realiza pruebas en otro equipo con resultados exitosos
      </button>
    </div>
  </div>

  <script>
    function seleccionarBoton(elemento) {
      const botones = document.querySelectorAll('.sub-btn');
      botones.forEach(btn => btn.classList.remove('active'));
      elemento.classList.add('active');
    }
  </script>
</body>
</html>
