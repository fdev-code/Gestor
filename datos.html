<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Datos | Gestor Manao</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0px;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 950px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(4px);
    }

    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .form-header h2 {
      color: #ec4899;
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .submenu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .sub-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .sub-btn.full-row {
      grid-column: span 2;
    }

    .sub-btn i {
      color: #a855f7;
      font-size: 1.15rem;
      transition: all 0.3s ease;
    }

    .sub-btn:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: #a855f7;
      transform: translateY(-2px);
    }

    .sub-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: #ec4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
    }

    .sub-btn.active i {
      color: #ec4899;
    }

    @media (max-width: 600px) {
      .submenu-grid {
        grid-template-columns: 1fr;
      }
      .sub-btn.full-row {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2><i class="fa-solid fa-database"></i> Módulo de Datos</h2>
    </div>

    <div class="submenu-grid">
      <button type="button" class="sub-btn" data-sub="no-navega" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-wifi"></i> No navega 3G / 4G / LTE
      </button>

      <button type="button" class="sub-btn" data-sub="falla-sim-equipo" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-sim-card"></i> Falla de simcard o equipo
      </button>

      <button type="button" class="sub-btn full-row" data-sub="cobertura" onclick="seleccionarBoton(this)">
        <i class="fa-solid fa-tower-cell"></i> Cobertura
      </button>
    </div>
  </div>

  <script>
    function seleccionarBoton(elemento) {
      const botones = document.querySelectorAll('.sub-btn');
      botones.forEach(btn => btn.classList.remove('active'));
      elemento.classList.add('active');
    }
  </script>
</body>
</html>
